[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-risk"
version = "0.1.0"
description = "Autonomous Multi-Agent Business Risk Intelligence & Stress Testing Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# yfinance is the unofficial Yahoo access library (frozen data.md §2).
# Optional: the Stooq adapter is primary; Yahoo is the throttled fallback.
market = ["yfinance>=0.2"]
# Notebook tooling for research/analysis surfaces (production logic never
# lives in notebooks; see docs/03_data-engineering/).
notebook = [
    "jupyter-core>=5.7",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/database/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ is frozen Phase 0/1 architecture documentation — not code targets.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
exclude = ["backend/database/migrations/"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
